<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title_exams">মডেল টেস্ট — পরীক্ষা</title>
<link rel="stylesheet" href="/css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header><div class="nav"></div></header>
<div class="container">
  <div class="section">
    <h2 data-i18n="h2_exams">📝 মডেল টেস্ট</h2>
    <div style="margin-bottom:12px"><label data-i18n="filter_category">ক্যাটাগরি ফিল্টার</label><select id="f-cat" style="max-width:320px"><option value="" data-i18n="opt_all">— সব —</option></select></div>
    <div class="grid" id="exams"></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/lang.js"></script>
<script>
const T = PK.lang.t;
(async () => {
  const u = await PK.requireAuth(); if (!u) return;
  await PK.nav('exams');
  const cat = await PK.api('/api/catalog');
  const sel = document.getElementById('f-cat');
  const urlCat = new URLSearchParams(location.search).get('cat');
  cat.categories.forEach(c => sel.innerHTML += `<option value="${c.id}" ${urlCat == c.id ? 'selected' : ''}>${PK.esc(c.name_bn)}</option>`);
  sel.onchange = load;
  load();
  async function load() {
    const d = await PK.api('/api/exams');
    const list = d.exams.filter(e => !sel.value || e.category_id == sel.value);
    document.getElementById('exams').innerHTML = list.length ? list.map(e => `
      <div class="card">
        <h3>${PK.esc(e.title)}</h3>
        <p class="muted">${PK.esc(e.category_name || '')} • ⏱️ ${e.duration_min} ${T('min_unit')} • ${e.question_limit}${T('q_count_suffix')}${e.negative_mark ? ` • ➖${e.negative_mark} ${T('negative')}` : ''}</p>
        <div style="margin-top:10px;display:flex;gap:8px">
          <a class="btn small" href="/exam.html?id=${e.id}">${T('btn_take_exam')}</a>
          <a class="btn small secondary" href="/leaderboard.html?exam=${e.id}">${T('btn_lb')}</a>
        </div>
      </div>`).join('') : `<p class="muted">${T('no_exams')}</p>`;
  }
})();
</script>
</body>
</html>
