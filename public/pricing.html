<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title_pricing">প্রাইসিং — পরীক্ষা</title>
<link rel="stylesheet" href="/css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header><div class="nav"></div></header>
<div class="container">
  <div class="section">
    <h2 data-i18n="h2_pricing">প্ল্যান বেছে নাও</h2>
    <div class="grid" id="plans"></div>

    <div id="pay-box" class="card" style="display:none;margin-top:20px;max-width:520px">
      <h3 data-i18n="h3_pay">bKash-এ পেমেন্ট করো</h3>
      <ol>
        <li><span data-i18n="pay_step1a">bKash অ্যাপ থেকে <b>Send Money</b> <span data-i18n="pay_step1b">করো: <b id="merchant">01XXXXXXXXX</b> <span data-i18n="merchant_label">(মার্চেন্ট নম্বর)</li>
        <li><span data-i18n="pay_step2">টাকার পরিমাণ: <b>৳<span id="pay-amount"></span></b></li>
        <li data-i18n="pay_step3">ট্রানজেকশন আইডি (TrxID) নিচে দাও</li>
      </ol>
      <label data-i18n="label_txn">bKash ট্রানজেকশন আইডি (TrxID)<input id="txn" data-i18n-ph="ph_txn" placeholder="যেমন: 9HXK2LMN4P">
      <label data-i18n="label_sender">তোমার bKash নম্বর<input id="sender" placeholder="01XXXXXXXXX">
      <button class="btn" onclick="submitPayment()" data-i18n="btn_submit_pay">জমা দাও</button>
      <p class="muted" style="margin-top:8px" data-i18n="pay_note">অ্যাডমিন যাচাই করে ২৪ ঘণ্টার মধ্যে প্রিমিয়াম চালু করে দেবেন।</p>
    </div>

    <h3 style="margin-top:20px" data-i18n="h3_my_payments">আমার পেমেন্ট</h3>
    <div id="my-payments"></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/lang.js"></script>
<script>
const T = PK.lang.t;
(async () => {
  const u = await PK.requireAuth(); if (!u) return;
  await PK.nav('pricing');
  const d = await PK.api('/api/payments/plans');
  document.getElementById('plans').innerHTML = d.plans.map(p => `
    <div class="card" ${p.id === 'premium' ? 'style="border:2px solid #f5a623"' : ''}>
      <h3>${p.id === 'premium' ? IC.star : IC.tag} ${PK.esc(p.name_bn)}</h3>
      <div class="result-big" style="font-size:2rem">${p.price === 0 ? T('price_free') : '৳' + p.price}</div>
      <p class="muted">${p.id === 'premium' ? p.days + T('days_suffix') : T('always')}</p>
      <ul>${p.features.map(f => `<li>${PK.esc(f)}</li>`).join('')}</ul>
      ${p.id === 'premium' ? (u.plan === 'premium'
        ? `<p class="pass">${T('premium_on')}</p>`
        : `<button class="btn" onclick="showPay(${p.price})">${T('btn_get_premium')}</button>`) : ''}
    </div>`).join('');
  loadMine();
})();

function showPay(amount) {
  document.getElementById('pay-amount').textContent = amount;
  document.getElementById('pay-box').style.display = 'block';
  window.scrollTo(0, document.getElementById('pay-box').offsetTop);
}

async function submitPayment() {
  try {
    await PK.api('/api/payments', { method: 'POST', body: {
      bkash_txn_id: document.getElementById('txn').value.trim(),
      sender_number: document.getElementById('sender').value.trim() } });
    PK.toast(T('toast_payment_submitted'));
    document.getElementById('pay-box').style.display = 'none';
    loadMine();
  } catch (e) { PK.toast(e.message); }
}

async function loadMine() {
  const d = await PK.api('/api/payments/mine');
  const badge = s => s === 'approved' ? `<span class="pass">${T('status_approved')}</span>` : s === 'rejected' ? `<span class="fail">${T('status_rejected')}</span>` : T('status_pending');
  document.getElementById('my-payments').innerHTML = d.payments.length ? `<table>
    <tr><th>${T('th_date')}</th><th>${T('th_txn')}</th><th>${T('th_amount')}</th><th>${T('th_status')}</th></tr>
    ${d.payments.map(p => `<tr><td>${PK.esc(p.created_at.slice(0, 16))}</td><td>${PK.esc(p.bkash_txn_id)}</td><td>৳${p.amount}</td><td>${badge(p.status)}</td></tr>`).join('')}
    </table>` : `<p class="muted">${T('no_payments')}</p>`;
}
</script>
</body>
</html>
