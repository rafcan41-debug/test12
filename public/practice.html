<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্র্যাকটিস — পরীক্ষা</title>
<link rel="stylesheet" href="/css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header><div class="nav"></div></header>
<div class="container">
  <div class="section">
    <h2>⚡ কুইক প্র্যাকটিস</h2>

    <div id="setup" class="card">
      <div class="two-col">
        <div>
          <label>ক্যাটাগরি</label><select id="f-cat"><option value="">— সব —</option></select>
          <label>বিষয়</label><select id="f-sub"><option value="">— সব —</option></select>
        </div>
        <div>
          <label>অধ্যায়</label><select id="f-ch"><option value="">— সব —</option></select>
          <label>টপিক</label><select id="f-tp"><option value="">— সব —</option></select>
        </div>
      </div>
      <div class="two-col">
        <div>
          <label>কাঠিন্য</label>
          <select id="f-diff"><option value="">— সব —</option><option value="easy">সহজ</option><option value="medium">মাঝারি</option><option value="hard">কঠিন</option></select>
        </div>
        <div>
          <label>প্রশ্ন সংখ্যা</label>
          <select id="f-limit"><option>5</option><option selected>10</option><option>20</option><option>30</option></select>
        </div>
      </div>
      <h3 style="margin-top:12px">📜 বিগত বছরের প্রশ্ন</h3>
      <div class="two-col">
        <div>
          <label><input type="checkbox" id="f-prevyear" style="width:auto"> শুধু বিগত বছরের প্রশ্ন</label>
          <label>বছর (যেমন 2024)</label><input id="f-year" type="number" min="1990" max="2100" placeholder="যেমন: 2024">
        </div>
        <div>
          <label>উৎস (যেমন: SSC Dhaka Board)</label><input id="f-source" placeholder="যেমন: Medical Admission">
        </div>
      </div>
      <button class="btn" onclick="startPractice()">প্র্যাকটিস শুরু করো</button>
    </div>

    <div id="run" style="display:none">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b id="p-progress"></b><span id="p-score" class="muted"></span>
        </div>
        <div id="p-q"></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn secondary" id="p-next" onclick="nextQ()" disabled>পরের প্রশ্ন →</button>
          <button class="btn danger" onclick="finishSession()">শেষ করো</button>
        </div>
      </div>
    </div>

    <div id="done" class="card" style="display:none"></div>

    <h2 style="margin-top:24px">🕘 প্র্যাকটিস হিস্ট্রি</h2>
    <div id="history"></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
let CAT = [], sessionId = null, qs = [], idx = 0, correct = 0, answered = 0;

(async () => {
  const u = await PK.requireAuth(); if (!u) return;
  await PK.nav('practice');
  const d = await PK.api('/api/catalog');
  CAT = d.categories;
  const cs = document.getElementById('f-cat');
  CAT.forEach(c => cs.innerHTML += `<option value="${c.id}">${PK.esc(c.name_bn)}</option>`);
  cs.onchange = () => {
    const c = CAT.find(x => x.id == cs.value);
    const ss = document.getElementById('f-sub'); ss.innerHTML = '<option value="">— সব —</option>';
    (c ? c.subjects : []).forEach(s => ss.innerHTML += `<option value="${s.id}">${PK.esc(s.name_bn)}</option>`);
    ss.onchange();
  };
  document.getElementById('f-sub').onchange = (e) => {
    const c = CAT.find(x => x.id == cs.value);
    const s = c && c.subjects.find(x => x.id == (e.target ? e.target.value : document.getElementById('f-sub').value));
    const ch = document.getElementById('f-ch'); ch.innerHTML = '<option value="">— সব —</option>';
    (s ? s.chapters : []).forEach(x => ch.innerHTML += `<option value="${x.id}">${PK.esc(x.name_bn)}</option>`);
    ch.onchange();
  };
  document.getElementById('f-ch').onchange = () => {
    const c = CAT.find(x => x.id == cs.value);
    const s = c && c.subjects.find(x => x.id == document.getElementById('f-sub').value);
    const chh = s && s.chapters.find(x => x.id == document.getElementById('f-ch').value);
    const tp = document.getElementById('f-tp'); tp.innerHTML = '<option value="">— সব —</option>';
    (chh ? chh.topics : []).forEach(x => tp.innerHTML += `<option value="${x.id}">${PK.esc(x.name_bn)}</option>`);
  };
  loadHistory();
})();

const val = id => { const v = document.getElementById(id).value; return v ? (isNaN(v) || id === 'f-source' ? v : Number(v)) : undefined; };

async function startPractice() {
  const body = {
    subject_id: val('f-sub'), chapter_id: val('f-ch'), topic_id: val('f-tp'),
    difficulty: document.getElementById('f-diff').value || undefined,
    limit: Number(document.getElementById('f-limit').value),
    prev_year: document.getElementById('f-prevyear').checked || undefined,
    year: document.getElementById('f-year').value ? Number(document.getElementById('f-year').value) : undefined,
    source: document.getElementById('f-source').value.trim() || undefined,
  };
  try {
    const d = await PK.api('/api/practice/start', { method: 'POST', body });
    sessionId = d.session_id; qs = d.questions; idx = 0; correct = 0; answered = 0;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('run').style.display = 'block';
    document.getElementById('done').style.display = 'none';
    renderQ();
  } catch (e) { PK.toast(e.message); }
}

function renderQ() {
  const q = qs[idx];
  document.getElementById('p-progress').textContent = `প্রশ্ন ${idx + 1} / ${qs.length}`;
  document.getElementById('p-score').textContent = `সঠিক: ${correct}`;
  document.getElementById('p-next').disabled = true;
  document.getElementById('p-q').innerHTML = `
    <h3 style="margin:12px 0">${PK.esc(q.question_text)}</h3>
    ${['a','b','c','d'].map(o => `<button class="option" data-o="${o}" onclick="answer('${o}')"><b>${o.toUpperCase()}.</b> ${PK.esc(q['option_'+o])}</button>`).join('')}
    <div id="p-fb"></div>`;
}

async function answer(sel) {
  const q = qs[idx];
  document.querySelectorAll('#p-q .option').forEach(b => b.disabled = true);
  try {
    const d = await PK.api(`/api/practice/${sessionId}/answer`, { method: 'POST', body: { question_id: q.id, selected: sel } });
    answered++;
    if (d.correct) correct++;
    document.querySelectorAll('#p-q .option').forEach(b => {
      if (b.dataset.o === d.correct_option) b.classList.add('correct');
      else if (b.dataset.o === sel) b.classList.add('wrong');
    });
    document.getElementById('p-fb').innerHTML = `
      <div class="explain"><b>${d.correct ? '✅ সঠিক!' : '❌ ভুল — সঠিক উত্তর: ' + d.correct_option.toUpperCase()}</b>
      ${d.explanation ? '<br>' + PK.esc(d.explanation) : ''}</div>`;
    document.getElementById('p-next').disabled = false;
    document.getElementById('p-next').textContent = idx + 1 < qs.length ? 'পরের প্রশ্ন →' : 'ফলাফল দেখো';
  } catch (e) { PK.toast(e.message); }
}

function nextQ() {
  if (idx + 1 < qs.length) { idx++; renderQ(); }
  else finishSession();
}

async function finishSession() {
  try { await PK.api(`/api/practice/${sessionId}/finish`, { method: 'POST' }); } catch (e) {}
  document.getElementById('run').style.display = 'none';
  const d = document.getElementById('done');
  d.style.display = 'block';
  d.innerHTML = `<h2>🎉 সেশন শেষ!</h2><p>মোট প্রশ্ন: ${qs.length} | সঠিক: <b class="pass">${correct}</b> | ভুল: <b class="fail">${answered - correct}</b></p>
    <button class="btn" onclick="location.reload()">নতুন প্র্যাকটিস</button>`;
  loadHistory();
}

async function loadHistory() {
  try {
    const d = await PK.api('/api/practice/history');
    document.getElementById('history').innerHTML = d.sessions.length ? `<table>
      <tr><th>তারিখ</th><th>মোট</th><th>সঠিক</th><th>অবস্থা</th></tr>
      ${d.sessions.map(s => `<tr><td>${PK.esc(s.created_at.slice(0,16))}</td><td>${s.total}</td><td>${s.correct}</td><td>${s.status === 'finished' ? 'শেষ' : 'চলমান'}</td></tr>`).join('')}
      </table>` : '<p class="muted">এখনো কোনো প্র্যাকটিস হয়নি।</p>';
  } catch (e) {}
}
</script>
</body>
</html>
