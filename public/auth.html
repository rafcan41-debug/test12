<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title_auth">লগইন / রেজিস্টার — পরীক্ষা</title>
<link rel="stylesheet" href="/css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header><div class="nav"></div></header>
<div class="container">
  <div class="card form-card">
    <div class="tabs">
      <button id="tab-login" class="active" data-i18n="tab_login">লগইন</button>
      <button id="tab-reg" data-i18n="tab_reg">রেজিস্টার</button>
      <button id="tab-forgot" data-i18n="tab_forgot">পাসওয়ার্ড ভুলে গেছি</button>
    </div>

    <div id="pane-login">
      <label data-i18n="label_email">ইমেইল<input id="l-email" type="email" placeholder="you@example.com">
      <label data-i18n="label_password">পাসওয়ার্ড<input id="l-pass" type="password" placeholder="••••••">
      <button class="btn" onclick="doLogin()" data-i18n="btn_login">লগইন</button>
    </div>

    <div id="pane-reg" style="display:none">
      <label data-i18n="label_name">নাম<input id="r-name" data-i18n-ph="ph_name" placeholder="তোমার নাম">
      <label data-i18n="label_email">ইমেইল<input id="r-email" type="email" placeholder="you@example.com">
      <label data-i18n="label_password_min">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)<input id="r-pass" type="password">
      <label data-i18n="label_institution_opt">শিক্ষাপ্রতিষ্ঠান (ঐচ্ছিক)<input id="r-inst" data-i18n-ph="ph_institution" placeholder="স্কুল/কলেজের নাম">
      <label data-i18n="label_class_opt">শ্রেণি (ঐচ্ছিক)<input id="r-class" data-i18n-ph="ph_class" placeholder="যেমন: HSC ২য় বর্ষ">
      <button class="btn" onclick="doRegister()" data-i18n="btn_register">অ্যাকাউন্ট খোলো</button>
    </div>

    <div id="pane-forgot" style="display:none">
      <p class="muted" data-i18n="forgot_info">ইমেইল দাও — রিসেট টোকেন তৈরি হবে (ডেমো সংস্করণে সার্ভার লগে দেখা যাবে)।</p>
      <label data-i18n="label_email">ইমেইল<input id="f-email" type="email">
      <button class="btn" onclick="doForgot()" data-i18n="btn_send_reset">রিসেট লিংক পাঠাও</button>
      <div id="reset-box" style="display:none;margin-top:12px">
        <label data-i18n="label_token">টোকেন<input id="f-token" data-i18n-ph="ph_token" placeholder="সার্ভার লগ থেকে টোকেন">
        <label data-i18n="label_new_password">নতুন পাসওয়ার্ড<input id="f-pass" type="password">
        <button class="btn secondary" onclick="doReset()" data-i18n="btn_change_pw">পাসওয়ার্ড বদলাও</button>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/lang.js"></script>
<script>
const T = PK.lang.t;
PK.nav();
function tab(name) {
  ['login','reg','forgot'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
    document.getElementById('pane-'+t).style.display = t===name ? 'block' : 'none';
  });
}
document.getElementById('tab-login').onclick = () => tab('login');
document.getElementById('tab-reg').onclick = () => tab('reg');
document.getElementById('tab-forgot').onclick = () => tab('forgot');

async function doLogin() {
  try {
    await PK.api('/api/auth/login', { method: 'POST', body: {
      email: document.getElementById('l-email').value, password: document.getElementById('l-pass').value } });
    PK.user = null; location.href = '/dashboard.html';
  } catch (e) { PK.toast(e.message); }
}
async function doRegister() {
  try {
    await PK.api('/api/auth/register', { method: 'POST', body: {
      name: document.getElementById('r-name').value, email: document.getElementById('r-email').value,
      password: document.getElementById('r-pass').value, institution: document.getElementById('r-inst').value,
      class: document.getElementById('r-class').value } });
    PK.user = null; location.href = '/dashboard.html';
  } catch (e) { PK.toast(e.message); }
}
async function doForgot() {
  try {
    const d = await PK.api('/api/auth/forgot', { method: 'POST', body: { email: document.getElementById('f-email').value } });
    PK.toast(d.message); document.getElementById('reset-box').style.display = 'block';
  } catch (e) { PK.toast(e.message); }
}
async function doReset() {
  try {
    await PK.api('/api/auth/reset', { method: 'POST', body: {
      token: document.getElementById('f-token').value, password: document.getElementById('f-pass').value } });
    PK.toast(T('toast_pw_changed_login')); tab('login');
  } catch (e) { PK.toast(e.message); }
}
</script>
</body>
</html>
