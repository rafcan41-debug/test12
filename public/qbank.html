<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রশ্নব্যাংক — পরীক্ষা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f4f6f8; --card: #fff; --text: #1a1a2e; --muted: #6b7280; --green: #0d6e4f; --border: #e5e7eb; }
[data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --green: #34d399; --border: #334155; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hind Siliguri', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
.sidebar { width: 230px; background: var(--card); border-right: 1px solid var(--border); padding: 18px 10px; position: fixed; height: 100vh; overflow-y: auto; z-index: 20; }
.logo { font-size: 1.4rem; font-weight: 700; color: var(--green); padding: 0 12px 18px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-size: .92rem; color: var(--text); text-decoration: none; margin-bottom: 2px; }
.nav-item:hover { background: #e8f5e9; }
.nav-item.active { background: #e8f5e9; color: var(--green); font-weight: 600; }
.main { margin-left: 230px; flex: 1; }
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
.topbar h1 { font-size: 1.2rem; }
.theme-btn { background: #e8f5e9; border: none; border-radius: 20px; padding: 7px 14px; cursor: pointer; font-size: .85rem; color: var(--green); }
.content { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
/* Tabs + search */
.tabrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.tabs { display: flex; gap: 8px; }
.tab { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 20px; padding: 7px 20px; cursor: pointer; font-size: .88rem; font-family: inherit; }
.tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.search { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 20px; padding: 8px 18px; width: 260px; font-size: .88rem; font-family: inherit; }
/* Section */
.sec { background: var(--card); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
.sec.green-bg { background: #eef7ee; } [data-theme="dark"] .sec.green-bg { background: #1a2e22; }
.sec.mint-bg { background: #e8f8f3; } [data-theme="dark"] .sec.mint-bg { background: #1a2e28; }
.sec.olive-bg { background: #f0f0e4; } [data-theme="dark"] .sec.olive-bg { background: #2a2a1e; }
.sec h2 { font-size: 1.05rem; margin-bottom: 2px; }
.sec .sub { font-size: .82rem; color: var(--muted); margin-bottom: 14px; }
/* Model test cards */
.model-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.model-card { border-radius: 12px; padding: 16px; color: #fff; cursor: pointer; position: relative; min-height: 110px; transition: .2s; overflow: hidden; }
.model-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.model-card .live { position: absolute; top: 8px; right: 8px; background: #e53935; color: #fff; font-size: .65rem; font-weight: 700; border-radius: 8px; padding: 2px 8px; }
.model-card h3 { font-size: 1.15rem; margin-bottom: 4px; }
.model-card p { font-size: .8rem; opacity: .92; }
.model-card .yr { margin-top: 10px; font-size: .85rem; font-weight: 600; }
/* Subject cards */
.subj-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.subj-card { border-radius: 12px; padding: 18px 14px; color: #fff; cursor: pointer; min-height: 130px; display: flex; flex-direction: column; justify-content: space-between; transition: .2s; position: relative; overflow: hidden; }
.subj-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.subj-card h3 { font-size: 1rem; line-height: 1.4; }
.subj-card .big-ico { font-size: 3rem; text-align: right; opacity: .85; line-height: 1; }
.subj-card .cnt { font-size: .75rem; opacity: .9; margin-top: 6px; }
/* Uni cards */
.uni-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.uni-card { border-radius: 12px; padding: 20px 14px; color: #fff; cursor: pointer; text-align: center; transition: .2s; }
.uni-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.uni-card .u-logo { width: 56px; height: 56px; background: rgba(255,255,255,.95); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.uni-card .u-logo img { width: 48px; height: 48px; object-fit: contain; }
.uni-card h3 { font-size: 1rem; }
.uni-card .cnt { font-size: .75rem; opacity: .9; margin-top: 4px; }
/* Question view */
#qview { display: none; }
.back-btn { cursor: pointer; color: var(--green); font-weight: 700; margin-bottom: 14px; display: inline-block; }
.q-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
.q-num { display: inline-block; background: var(--green); color: #fff; font-weight: 700; border-radius: 6px; padding: 2px 10px; margin-bottom: 8px; font-size: .8rem; }
.q-text { font-size: 1rem; font-weight: 600; margin-bottom: 10px; line-height: 1.6; white-space: pre-line; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.opt { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
.opt b { color: var(--green); }
.ans { background: #e8f5e9; border-radius: 8px; padding: 10px 14px; } [data-theme="dark"] .ans { background: #064e3b; }
.ans .correct { color: var(--green); font-weight: 700; }
.ans .expl { margin-top: 6px; font-size: .86rem; color: var(--muted); line-height: 1.6; }
@media (max-width: 900px) { .sidebar { display: none; } .main { margin-left: 0; } .model-grid, .subj-grid, .uni-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 500px) { .opts { grid-template-columns: 1fr; } }
</style>
</head>

<div class="main">

function setTab(t,el){curTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 let h='';
 if(curTab==='model'){
  const list=MODELS.filter(m=>(m.t+m.s).toLowerCase().includes(q));
  h+='<div class="sec green-bg"><h2>মডেল টেস্ট</h2><div class="sub">সেরা প্রস্তুতির জন্য স্পেশাল মডেল টেস্ট</div><div class="model-grid">'+
   list.map(m=>'<div class="model-card" style="background:'+m.g+'" onclick="openQ(\''+(m.id||'')+'\',\''+m.t+' '+m.s+'\')"><span class="live">🔴 Live</span><h3>'+m.t+'</h3><p>'+m.s+'</p>'+(m.yr?'<div class="yr">📅 '+m.yr+'</div>':'')+'<div style="margin-top:8px;font-size:.8rem">📝 '+m.q+'টি প্রশ্ন</div></div>').join('')+'</div></div>';
 }
 if(curTab==='subject'){
  const list=SUBJECTS.filter(m=>(m.t+m.s).toLowerCase().includes(q));
  h+='<div class="sec mint-bg"><h2>বিষয় ভিত্তিক</h2><div class="sub">সকল বিষয়ের প্রশ্নব্যাংক</div><div class="subj-grid">'+
   list.map(m=>'<div class="subj-card" style="background:'+m.g+'" onclick="openQ(\''+(m.id||'')+'\',\''+m.t+' '+m.s+'\')"><h3>'+m.t+'<br>'+m.s+'</h3><div class="big-ico">'+m.i+'</div><div class="cnt">'+m.q+'টি প্রশ্ন</div></div>').join('')+'</div></div>';
 }
 if(curTab==='uni'){
  const list=UNIS.filter(m=>m.t.toLowerCase().includes(q));
  h+='<div class="sec olive-bg"><h2>প্রতিষ্ঠান ভিত্তিক</h2><div class="sub">বিগত বছরের ভর্তি পরীক্ষার প্রশ্ন</div><div class="uni-grid">'+
   list.map(m=>'<div class="uni-card" style="background:'+m.g+'" onclick="openUni(\''+m.t.replace(/'/g,"\\'")+'\')"><div class="u-logo">'+(m.logo?'<img src="'+m.logo+'" alt="'+m.t+'" onerror="this.style.display=\'none\'">':m.i)+'</div><h3>'+m.t+'</h3><div class="cnt">'+(m.units&&m.units.length?m.units.length+'টি ইউনিট':'শীঘ্রই আসছে')+'</div></div>').join('')+'</div></div>';

}
function openUni(name){
 const u=UNIS.find(x=>x.t===name);
 if(!u){alert('শীঘ্রই আসছে!');return;}
 // Map Bangla uni/unit names to DB unit codes
 const UM={'ঢাবি বি':'DU-B','ঢাবি সি':'DU-C','ঢাবি আইবিএ':'IBA-DU','আইবিএ':'IBA-DU'};
 document.getElementById('home-view').style.display='none';
 document.getElementById('qview').style.display='block';
 document.getElementById('qv-title').textContent=name+' — ইউনিট';
 const units=(u.units||[]).filter(x=>UM[x]);
 if(!units.length){document.getElementById('qlist').innerHTML='<p style="color:var(--muted)">শীঘ্রই আসছে!</p>';return;}
 document.getElementById('qlist').innerHTML='<div class="cards">'+units.map(x=>'<div class="card" onclick="openUnitYears(\''+UM[x]+'\',\''+x+'\')"><h3>'+x+'</h3><div class="meta"><span>📝 প্রশ্নব্যাংক</span></div></div>').join('')+'</div>';
 window.scrollTo(0,0);
}
function openUnitYears(unit,title){
 document.getElementById('qv-title').textContent=title+' — বছর';
 document.getElementById('qlist').innerHTML='<p>লোড হচ্ছে...</p>';
 fetch('/api/qbank/units/'+encodeURIComponent(unit)+'/years',{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}}).then(r=>r.json()).then(years=>{
  if(!years.length){document.getElementById('qlist').innerHTML='<p style="color:var(--muted)">প্রশ্ন পাওয়া যায়নি</p>';return;}
  document.getElementById('qlist').innerHTML='<div class="cards">'+years.map(y=>'<div class="card" onclick="openQ(\''+unit+'\',\''+y.year+'\',\''+title+' '+y.year+'\')"><h3>'+y.year+'</h3><div class="meta"><span>📝 '+y.c+'টি প্রশ্ন</span></div></div>').join('')+'</div>';
 }).catch(()=>{document.getElementById('qlist').innerHTML='<p style="color:var(--muted)">লগইন করে আবার চেষ্টা করো।</p>';});
 window.scrollTo(0,0);
}
function openQ(unit,year,title){
 if(!unit){alert('শীঘ্রই আসছে!');return;}
 document.getElementById('home-view').style.display='none';
 document.getElementById('qview').style.display='block';
 document.getElementById('qv-title').textContent=title;
 document.getElementById('qlist').innerHTML='<p>লোড হচ্ছে...</p>';
 fetch('/api/qbank?unit='+encodeURIComponent(unit)+(year?'&year='+year:'')+'&limit=100',{headers:{'Authorization':'Bearer '+localStorage.getItem('token')}}).then(r=>r.json()).then(d=>showQ(d.questions||d)).catch(()=>{document.getElementById('qlist').innerHTML='<p style="color:var(--muted)">লগইন করে আবার চেষ্টা করো।</p>';});
 window.scrollTo(0,0);
}
function showQ(qs){
 const ABC=['ক','খ','গ','ঘ'];
 document.getElementById('qlist').innerHTML=qs.map((x,i)=>'<div class="q-card"><span class="q-num">'+(i+1)+'</span><div class="q-text">'+esc(x.question_text)+'</div><div class="opts">'+['option_a','option_b','option_c','option_d'].map((k,j)=>'<div class="opt"><b>'+ABC[j]+'.</b> '+esc(x[k])+'</div>').join('')+'</div>'+(x.correct_option?'<div class="ans"><span class="correct">✅ উত্তর: ('+ABC['abcd'.indexOf(x.correct_option)]+') '+esc(x['option_'+x.correct_option])+'</span>'+(x.explanation?'<div class="expl">'+esc(x.explanation)+'</div>':'')+'</div>':'')+'</div>').join('');
}
function esc(t){if(!t)return '';const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function goHome(){document.getElementById('qview').style.display='none';document.getElementById('home-view').style.display='block';}
render();
</script>
</body>
</html>
